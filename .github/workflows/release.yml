name: Release

# 发布规则（以 tag 为准）：
#   push 带 tag 的 commit（tag 形如 v1.2.3）→ 跑测试 + 编译 Windows/Linux x86
#     二进制 + 推送 ghcr 镜像 + 创建/更新该 tag 的 GitHub Release
#   push 到 main（无 tag）                  → 只跑测试，不发布
#   workflow_dispatch                       → 手动发布：可指定版本号；
#     留空则按已有 tag 自动递增 patch 并创建新 tag
#
# tag 由维护者自行创建并推送，例如：
#   git tag v1.2.3 && git push origin v1.2.3

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 要发布的版本号（不带 v；留空则自动递增 patch）
        type: string
        default: ""

permissions:
  contents: write # 创建 tag / Release
  packages: write # 推送 ghcr.io 镜像

# 同一时间只跑一个发布流程
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  version:
    name: Decide version
    runs-on: ubuntu-latest
    needs: test
    outputs:
      should_release: ${{ steps.decide.outputs.should_release }}
      version: ${{ steps.decide.outputs.version }}
      tag: ${{ steps.decide.outputs.tag }}
      image: ${{ steps.decide.outputs.image }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 需要 tag 历史

      - name: Decide whether to release and which version
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          version=""
          tag=""
          should_release="false"

          if [ "$REF_TYPE" = "tag" ]; then
            # 推送了 tag：以该 tag 为准发布
            tag="$REF_NAME"
            version="${tag#v}"
            should_release="true"
            echo "tag 推送：发布 $tag"
          elif [ "$EVENT" = "workflow_dispatch" ]; then
            # 手动触发：指定版本，或自动递增 patch
            if [ -n "$INPUT_VERSION" ]; then
              version="${INPUT_VERSION#v}"
            else
              version="$(.github/scripts/next-version.sh patch)"
            fi
            tag="v${version}"
            should_release="true"
            echo "手动触发：发布 $tag"
          else
            # main 分支推送：只有当前 commit 已经带 tag 时才发布
            head_tag="$(git tag --points-at HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"
            if [ -n "$head_tag" ]; then
              tag="$head_tag"
              version="${tag#v}"
              should_release="true"
              echo "当前 commit 已带 tag：发布 $tag"
            else
              echo "当前 commit 没有 tag：只跑测试，不发布"
            fi
          fi

          {
            echo "should_release=$should_release"
            echo "version=$version"
            echo "tag=$tag"
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

  binaries:
    name: Build binaries (${{ matrix.goos }})
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.should_release == 'true'
    strategy:
      matrix:
        include:
          - goos: linux
            ext: ""
            archive: tar.gz
          - goos: windows
            ext: ".exe"
            archive: zip
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GOOS: ${{ matrix.goos }}
      GOARCH: amd64
      EXT: ${{ matrix.ext }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ${{ matrix.goos }}/amd64
        run: |
          set -euo pipefail
          mkdir -p dist
          for cmd in server fetch render; do
            CGO_ENABLED=0 go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/buaa-schedule-${cmd}${EXT}" "./cmd/${cmd}"
          done
          ls -l dist

      - name: Package
        run: |
          set -euo pipefail
          name="buaa-schedule-${VERSION}-${{ matrix.goos }}-amd64"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            (cd dist && zip -9 "../${name}.zip" ./*)
          else
            tar -C dist -czf "${name}.tar.gz" .
          fi
          mkdir -p upload
          mv "${name}.${{ matrix.archive }}" upload/
          ls -l upload

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.goos }}
          path: upload/*
          if-no-files-found: error

  docker:
    name: Publish image
    runs-on: ubuntu-latest
    needs: version
    if: needs.version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ needs.version.outputs.image }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create release
    runs-on: ubuntu-latest
    needs: [version, binaries]
    if: needs.version.outputs.should_release == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Tag, notes and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          IMAGE: ${{ needs.version.outputs.image }}
        run: |
          set -euo pipefail

          # tag 已存在（推 tag 触发）则保持不动；手动发布时创建并推送
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "tag ${TAG} 已存在，保持不变"
          else
            git tag "${TAG}"
            git push origin "${TAG}"
          fi

          previous="$(git tag --list 'v[0-9]*' --sort=-v:refname \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
            | grep -v "^${TAG}$" \
            | head -n 1 || true)"

          {
            echo '## 容器镜像'
            echo
            echo "\`${IMAGE}:${VERSION}\`"
            echo
            echo '```bash'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo '```'
            echo
            echo '## 二进制'
            echo
            echo '下载下方 Windows / Linux (amd64) 压缩包，解压后得到 server / fetch / render 三个可执行文件。'
            echo
            if [ -n "$previous" ]; then
              echo "## 自 ${previous} 以来的改动"
              echo
              git log --no-merges --pretty='- %s (%h)' "${previous}..${TAG}"
            else
              echo '## 首个发布'
            fi
          } > /tmp/notes.md

          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} 已存在，仅更新附件"
            gh release upload "${TAG}" dist/* --clobber
          else
            gh release create "${TAG}" --title "${TAG}" --notes-file /tmp/notes.md dist/*
          fi
